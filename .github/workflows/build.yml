name: Build iOSCleanerInspector

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          clang --version

      - name: Build signed TIPA
        run: |
          make package

      # APP_NAME comes from the Makefile, so the same workflow serves both the
      # read-only inspector (main) and the cleaner branch.
      - name: Resolve artifact paths
        id: paths
        run: |
          set -euo pipefail
          APP=$(ls -d build/Payload/*.app | head -1)
          NAME=$(basename "$APP" .app)
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "bin=$APP/$NAME" >> "$GITHUB_OUTPUT"
          echo "tipa=$(ls build/*.tipa | head -1)" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Verify code signature and entitlements
        run: |
          set -euo pipefail
          echo "== codesign =="
          codesign --display --verbose=2 "${{ steps.paths.outputs.app }}"
          echo "== entitlements actually granted by the signature =="
          # NOT "codesign --entitlements :-" : that form is deprecated.
          codesign --display --entitlements "$RUNNER_TEMP/granted.plist" --xml \
            "${{ steps.paths.outputs.app }}"
          cat "$RUNNER_TEMP/granted.plist"
          echo "== entitlements embedded in __TEXT (independent re-read) =="
          python3 tools/decompile/extract_entitlements.py "${{ steps.paths.outputs.bin }}"

      - name: Inspect artifact
        run: |
          unzip -l "${{ steps.paths.outputs.tipa }}"
          file "${{ steps.paths.outputs.bin }}"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" \
            "${{ steps.paths.outputs.app }}/Info.plist"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.paths.outputs.name }}-${{ github.sha }}
          path: |
            ${{ steps.paths.outputs.tipa }}
            ${{ steps.paths.outputs.app }}
